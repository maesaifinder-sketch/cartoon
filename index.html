<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Story Structure Builder PRO+ (ChatGPT Edition)</title>
<style>
:root {
  --bg: #0B0E14;
  --card: #151828;
  --card2: #1B1E31;
  --line: #2A2F4C;
  --text: #E2E8F0;
  --muted: #828A9F;
  --green: #20C997;
  --blue: #3B82F6;
  --purple: #8B5CF6;
  --orange: #F59E0B;
  --red: #EF4444;
  --dark-btn: #1E2436;
}
* { box-sizing: border-box; }
body { 
  margin: 0; 
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; 
  background: var(--bg); 
  color: var(--text);
  overflow-x: hidden;
}
.container { display: flex; min-height: 100vh; }
.left { width: 60%; padding: 20px; margin-right: 40%; overflow-y: auto; height: 100vh; }
.right { 
  width: 40%; position: fixed; right: 0; top: 0; height: 100vh; 
  padding: 20px; background: #0F121B; border-left: 1px solid var(--line); 
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
}
.topbar { 
  display: flex; gap: 8px; position: sticky; top: 0; z-index: 20; 
  padding-bottom: 16px; padding-top: 10px; background: var(--bg);
  border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap;
}
button, select, input, textarea { 
  font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 10px 14px; 
}
button { cursor: pointer; font-weight: 600; transition: all 0.2s; }
button:hover { filter: brightness(1.1); }
select, input, textarea { width: 100%; background: #090B10; color: #fff; }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--purple); }
button { color: #fff; border: 0; }
.btn-blue { background: var(--blue); }
.btn-purple { background: var(--purple); }
.btn-green { background: var(--green); color: #000; }
.btn-orange { background: var(--orange); color: #000; }
.btn-dark { background: var(--dark-btn); border: 1px solid var(--line); }
.active-mode { outline: 2px solid var(--green); box-shadow: 0 0 16px rgba(32, 201, 151, 0.4); }

.card { 
  background: var(--card); border: 1px solid var(--line); 
  border-left: 4px solid var(--purple); border-radius: 12px; 
  padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.card h2 { font-size: 15px; margin: 0 0 10px; color: #fff; display: flex; align-items: center; gap: 8px; }
.row { display: flex; gap: 8px; margin-top: 10px; }
.row > * { flex: 1; }
.add { background: #10B981; color: #000; }
.edit { background: var(--blue); }
.del { background: var(--dark-btn); color: var(--muted); }
.copy { background: #334155; }
.generate { background: linear-gradient(90deg, #8B5CF6, #3B82F6); font-size: 16px; padding: 14px; }
.secondary { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.hidden { display: none !important; }

.master-panel { 
  background: linear-gradient(180deg, #1A1D36, #121426); border: 1px solid var(--purple); 
  border-radius: 12px; padding: 14px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
}
.master-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.master-title { font-weight: 700; font-size: 14px; color: #fff; }
.master-sub { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.lock-badge { white-space: nowrap; font-size: 10px; padding: 4px 8px; border-radius: 999px; background: rgba(32,201,151,0.2); color: var(--green); border: 1px solid var(--green); }
.master-editor { width: 100%; min-height: 150px; margin-top: 10px; background: #000; color: #A78BFA; border: 1px solid #3B2A6B; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.4; resize: vertical; }
.master-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
.master-actions button { font-size: 11px; padding: 8px; }
.master-status { font-size: 11px; color: var(--green); margin-top: 8px; }

.output { flex: 1; min-height: 250px; background: #050505; color: #10B981; border: 1px solid #064E3B; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; resize: none; line-height: 1.5; padding: 12px; }
.status { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #1E293B; color: #94A3B8; font-size: 11px; margin: 2px; border: 1px solid var(--line); }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal.show { display: flex; }
.modal-box { width: min(600px, 94vw); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions > * { flex: 1; }

@media(max-width: 900px) {
  .left { width: 100%; margin-right: 0; height: auto; }
  .right { position: relative; width: 100%; height: auto; border-left: 0; border-top: 1px solid var(--line); }
  .container { display: block; }
}
</style>
</head>
<body>
<div class="container">
<section class="left">
<div class="topbar">
  <button class="btn-blue active-mode" id="btnTopic" onclick="modeTopic()">📝 สร้างเรื่อง</button>
  <button class="btn-purple" onclick="window.open('https://countik.com/th/tiktok-video-to-mp3-converter', '_blank')">สร้างเสียง 🎧</button>
  <button class="btn-orange" onclick="window.open('https://gemini.google.com/gem/1NQlXP6luO-FQ28PU5ATlhEAc7C7eC12v?usp=sharing', '_blank')">เปิดGem 🎬</button>
  <button class="btn-dark" onclick="copyCommand()">📋 คำสั่งวิเคราะห์</button>
</div>

<div class="card" id="presetCard" style="border-left-color: var(--green);">
  <h2>🧬 Story Style Preset</h2>
  <select id="presetSelect" onchange="loadPreset()"></select>
  <div class="row">
    <button class="add" onclick="openPresetModal()">➕ เพิ่ม</button>
    <button class="edit" onclick="editPresetModal()">✏️ แก้ไข</button>
    <button class="del" onclick="deletePreset()">🗑 ลบ</button>
  </div>
</div>

<div id="menu"></div>
</section>

<aside class="right">
<div class="master-panel">
  <div class="master-head">
    <div>
      <div class="master-title">⚙️ MASTER SETTINGS & CHATGPT RULES</div>
      <div class="master-sub">รองรับระบบ Continuation (พิมพ์ "ต่อ" หรือ "ฉากต่อไป")</div>
    </div>
    <span id="masterLock" class="lock-badge">🔒 TIME LOCKED (10s)</span>
  </div>
  <textarea id="masterStructure" class="master-editor" spellcheck="false"></textarea>
  <div class="master-actions">
    <button class="btn-blue" onclick="saveMasterStructure()">💾 บันทึก Master</button>
    <button class="secondary" onclick="resetMasterStructure()">↺ คืนค่าเดิม</button>
  </div>
  <div id="masterStatus" class="master-status">พร้อมสร้าง Prompt แบบต่อเนื่อง</div>
</div>

<div class="status" id="status">พร้อมสร้าง Prompt</div>
<textarea id="result" class="output" readonly></textarea>
<div class="row">
  <button class="copy" onclick="copyPromptText()">📋 Copy Prompt</button>
  <button class="generate" onclick="buildPrompt()">⚡ สร้าง Prompt</button>
</div>
<button class="secondary" onclick="clearData()" style="width: 100%; margin-top: 10px;">↻ รีเซ็ตข้อมูลทั้งหมด</button>
</aside>
</div>

<div class="modal" id="presetModal">
  <div class="modal-box">
    <h2 id="presetTitle">Preset</h2>
    <input id="presetName" placeholder="ชื่อ Preset" style="margin-bottom:10px;">
    <textarea id="presetText" rows="12" placeholder="Story Style DNA"></textarea>
    <div class="modal-actions">
      <button class="add" onclick="savePresetModal()">💾 บันทึก</button>
      <button class="del" onclick="closePresetModal()">❌ ปิด</button>
    </div>
  </div>
</div>
<div class="modal" id="itemModal">
  <div class="modal-box">
    <h2 id="itemTitle">เพิ่มข้อมูล</h2>
    <input id="itemName" placeholder="ชื่อที่แสดง (เช่น หมอเจมส์)" style="margin-bottom:10px;">
    <textarea id="itemText" rows="6" placeholder="รายละเอียด (ใส่ค่า Lock ที่นี่)"></textarea>
    <div class="modal-actions">
      <button class="add" onclick="saveItemModal()">💾 บันทึก</button>
      <button class="del" onclick="closeItemModal()">❌ ปิด</button>
    </div>
  </div>
</div>

<script>
const LS = 'STORY_STRUCTURE_BUILDER_PRO_V5';
const PS = 'STORY_STRUCTURE_PRESETS_V5';
const MASTER_KEY = 'STORY_STRUCTURE_MASTER_V5';

let mode = 'topic', editKey = null, editIndex = -1;

const defaultPresets = {
  raw: {name:'🔥 Raw เพื่อนเล่าให้เพื่อนฟัง', text:'RAW CONVERSATIONAL STORYTELLING. เล่าเหมือนกูนั่งเมาท์ให้มึงฟัง. ใช้ภาษาพูดจริง...'},
  comedy: {name:'😂 Comedy / กวน / พีค', text:'COMEDY STORY DNA. เปิดด้วยสถานการณ์หรือประโยคที่ชวนสงสัย...'},
  drama: {name:'💔 Drama / Emotional', text:'EMOTIONAL STORY DNA. เน้นความเป็นมนุษย์และความสัมพันธ์...'}
};

const DEFAULT_MASTER_STRUCTURE = `UNIVERSAL STORY STRUCTURE กลาง
01 ATTENTION / INTERRUPT
02 CONTEXT / HUMAN SETUP
03 TRIGGERING EVENT
04 REACTION
05 ESCALATION
06 OPEN LOOP / INFORMATION DELAY
07 REVELATION / TURNING POINT
08 TWIST OR EMOTIONAL CLIMAX
09 PAYOFF
10 REFLECTION / CALLBACK
11 NATURAL ENDING`;

let masterStructure = localStorage.getItem(MASTER_KEY) || DEFAULT_MASTER_STRUCTURE;
let presets = JSON.parse(localStorage.getItem(PS)||'null') || defaultPresets;

const defaultData = {
  topic: { enabled: true, title: '📝 หัวข้อเรื่อง (Topic)', items: [{name: 'พิมพ์หัวข้อที่นี่', text: ''}] },
  visualStyle: { enabled: true, title: '🎨 สไตล์ภาพ / 3D', items: [{name: 'AUTO', text: 'AUTO'}, {name: '3D', text: '3D Render, Cinematic lighting, Octane Render'}, {name: '3D อวัยวะ', text: '3D Anatomy, Medical accurate, Subsurface scattering, Cinematic macro'}, {name: '3D การแพทย์', text: '3D Medical Illustration, High-tech, Clean lighting, Clinical'}, {name: '3D จุลชีพ', text: '3D Microscopic, Microorganisms, Electron microscope style, Glowing edges'}] },
  charsLock: { enabled: true, title: '🔒 ตัวละคร (Characters Lock)', items: [{name: 'ไม่ระบุ', text: 'ไม่ระบุ'}] },
  locLock: { enabled: true, title: '🔒 สถานที่ (Location Lock)', items: [{name: 'ไม่ระบุ', text: 'ไม่ระบุ'}] },
  atmosLock: { enabled: true, title: '🔒 บรรยากาศ (Atmosphere Lock)', items: [{name: 'ไม่ระบุ', text: 'ไม่ระบุ'}] },
  voiceLock: { enabled: true, title: '🔒 จังหวะ และ น้ำเสียง (Voice/Pace Lock)', items: [{name: 'ปกติธรรมชาติ', text: 'จังหวะการพูดปกติ น้ำเสียงธรรมชาติ ความเร็วพอดี สอดคล้องกับเวลา 10 วินาที'}] },
  type: { enabled: true, title: '🎭 Story Type', items: [{name: 'AUTO', text: 'AUTO'}, {name: 'COMEDY', text: 'COMEDY'}, {name: 'DRAMA', text: 'DRAMA'}, {name: 'HORROR', text: 'HORROR'}] },
  scenes: { enabled: true, title: '🎬 จำนวน Scene ทั้งหมด', items: [{name: 'AUTO', text: 'AUTO'}, {name: '5 Scenes', text: '5'}, {name: '10 Scenes', text: '10'}] }
};

let data = JSON.parse(localStorage.getItem(LS) || 'null');
if(!data) {
  data = defaultData;
} else {
  Object.keys(defaultData).forEach(k => { if(!data[k]) data[k] = defaultData[k]; });
}

function save() { 
  localStorage.setItem(LS, JSON.stringify(data)); 
  localStorage.setItem(PS, JSON.stringify(presets)); 
}
function get(key) { 
  if(!data[key]?.enabled) return ''; 
  let s = document.getElementById(key+'_s'); 
  return s ? data[key].items[Number(s.value)]?.text || data[key].items[Number(s.value)]?.name || '' : ''; 
}
function section(key) { 
  let c = data[key]; 
  if(!c?.enabled) return ''; 
  return `<div class="card">
    <h2>${c.title}</h2>
    <select id="${key}_s" onchange="buildPrompt()">
      ${c.items.map((x,i) => `<option value="${i}">${esc(x.name)}</option>`).join('')}
    </select>
    <div class="row">
      <button class="add" onclick="openItem('${key}')">➕ เพิ่ม</button>
      <button class="edit" onclick="editItem('${key}')">✏️ แก้ไข</button>
      <button class="del" onclick="delItem('${key}')">🗑 ลบ</button>
    </div>
  </div>`;
}
function render() {
  document.getElementById('menu').innerHTML = 
    section('topic') + 
    section('visualStyle') + 
    section('charsLock') + 
    section('locLock') + 
    section('atmosLock') + 
    section('voiceLock') + 
    section('type') + 
    section('scenes');
  buildPrompt();
}
function renderPresets() {
  let s = document.getElementById('presetSelect');
  s.innerHTML = Object.keys(presets).map(k => `<option value="${k}">${esc(presets[k].name)}</option>`).join('');
}
function loadPreset() { buildPrompt(); }
function openPresetModal() { editKey = null; document.getElementById('presetTitle').innerText = '➕ เพิ่ม Story Preset'; document.getElementById('presetName').value = ''; document.getElementById('presetText').value = ''; document.getElementById('presetModal').classList.add('show'); }
function editPresetModal() { let k = document.getElementById('presetSelect').value, p = presets[k]; if(!p) return; editKey = k; document.getElementById('presetTitle').innerText = '✏️ แก้ไข Story Preset'; document.getElementById('presetName').value = p.name; document.getElementById('presetText').value = p.text; document.getElementById('presetModal').classList.add('show'); }
function closePresetModal() { document.getElementById('presetModal').classList.remove('show'); }
function savePresetModal() { let n = document.getElementById('presetName').value.trim(), t = document.getElementById('presetText').value.trim(); if(!n || !t) return alert('กรอกชื่อและรายละเอียดก่อน'); let k = (editKey || n).toLowerCase().replace(/[^a-z0-9ก-๙]+/gi, '_'); presets[k] = {name: n, text: t}; save(); renderPresets(); document.getElementById('presetSelect').value = k; loadPreset(); closePresetModal(); }

function openItem(k) { editKey = k; editIndex = -1; document.getElementById('itemTitle').innerText = '➕ เพิ่ม ' + data[k].title; document.getElementById('itemName').value = ''; document.getElementById('itemText').value = ''; document.getElementById('itemModal').classList.add('show'); }
function editItem(k) { let s = document.getElementById(k+'_s'); if(!s) return; editKey = k; editIndex = Number(s.value); let x = data[k].items[editIndex]; document.getElementById('itemTitle').innerText = '✏️ แก้ไข ' + data[k].title; document.getElementById('itemName').value = x.name; document.getElementById('itemText').value = x.text; document.getElementById('itemModal').classList.add('show'); }
function closeItemModal() { document.getElementById('itemModal').classList.remove('show'); }
function saveItemModal() { let n = document.getElementById('itemName').value.trim(), t = document.getElementById('itemText').value.trim(); if(!n && !t) return alert('กรอกข้อมูลก่อน'); let x = {name: n || t, text: t || n}; if(editIndex >= 0) data[editKey].items[editIndex] = x; else data[editKey].items.push(x); save(); render(); closeItemModal(); }
function delItem(k) { let s = document.getElementById(k+'_s'); if(!s) return; let i = Number(s.value); if(data[k].items.length <= 1) return alert('ต้องเหลืออย่างน้อย 1 รายการ'); if(confirm('ลบรายการนี้?')) { data[k].items.splice(i, 1); save(); render(); } }
function deletePreset() { let s = document.getElementById('presetSelect'), k = s.value; if(Object.keys(presets).length <= 1) return alert('ต้องเหลืออย่างน้อย 1 Preset'); if(confirm('ลบ Preset นี้?')) { delete presets[k]; save(); renderPresets(); loadPreset(); } }
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function copyCommand() {
  const textCmd = `วิเคราะห์ไฟล์เสียง MP3 ที่แนบมา เพื่อสกัด STORY STRUCTURE จากวิธีเล่าเรื่องจริงในไฟล์
ห้ามสร้างเรื่องใหม่
ห้ามสรุปแค่เนื้อหาว่าเรื่องพูดถึงอะไร

ให้ทำตามขั้นตอน:

OUTPUT 2 — STORY TIMELINE
OUTPUT 3 — REAL STORY SEQUENCE
OUTPUT 4 — EMOTIONAL ARC
OUTPUT 5 — VOICE & DELIVERY DNA
OUTPUT 6 — RETENTION DNA
OUTPUT 7 — STORY DNA
OUTPUT 8 — 🧬 STORY STRUCTURE กลาง

  navigator.clipboard.writeText(textCmd).then(() => alert('คัดลอกคำสั่งวิเคราะห์เรียบร้อยแล้ว นำไปวางใน ChatGPT/Gemini ได้เลย'));
}

function buildPrompt() {
  let topic = get('topic'), visual = get('visualStyle'), type = get('type'), scenes = get('scenes');
  let chars = get('charsLock'), loc = get('locLock'), atmos = get('atmosLock'), voice = get('voiceLock');
  let presetKey = document.getElementById('presetSelect').value;
  let presetText = presets[presetKey] ? presets[presetKey].text : '';

  let prompt = `######
AI STORY ARCHITECT & MULTI-SCENE CONTINUATION SYSTEM (CHATGPT EDITION)
######

ROLE:
You are an elite AI Story Architect and Short-Form Narrative Designer.

==================================================
🎬 SCENE CONTINUATION SYSTEM (CRITICAL RULES)
==================================================
1. TIME LOCK: EXACTLY 10 SECONDS PER SCENE.
2. DIALOGUE LIMIT: The dialogue/voiceover in each scene MUST realistically fit within 10 seconds of speaking time at the specified speed. DO NOT overstuff words.
3. COMMAND "ต่อ" or "ฉากต่อไป":
   When the user types "ต่อ", "ฉากต่อไป", or asks for the next scene:
   - DO NOT summarize the previous scene.
   - DO NOT output the whole story at once.
   - GENERATE ONLY ONE NEXT SCENE (exactly 10 seconds).
   - Wait for the next command before proceeding.
4. INITIAL OUTPUT: Generate ONLY SCENE 1 based on the structure, then stop and wait for the user to type "ต่อ".

==================================================
🔒 MASTER LOCKED ELEMENTS (MUST BE 100% CONSISTENT)
==================================================
The following elements are LOCKED and MUST NOT CHANGE randomly between scenes:

👤 CHARACTERS LOCK:
${chars || 'Not specified'}

📍 LOCATION LOCK:
${loc || 'Not specified'}

🌫️ ATMOSPHERE & ENVIRONMENT LOCK:
${atmos || 'Not specified'}

🗣️ VOICE, TONE, SPEED & RHYTHM LOCK (บทพูดและจังหวะ):
${voice || 'จังหวะปกติ น้ำเสียงธรรมชาติ สัมพันธ์กับเวลา 10 วินาที'}

🎨 VISUAL / 3D STYLE LOCK:
${visual || 'Not specified'}

==================================================
🧬 MASTER NARRATIVE STRUCTURE
==================================================
Follow this structure sequence as the scene progresses:
${masterStructure}

==================================================
📝 STORY BRIEF
==================================================
TOPIC: ${topic || '[ไม่ระบุ]'}

==================================================
OUTPUT FORMAT REQUIRED (FOR EACH SCENE)
==================================================
[Scene Number] / 10 วินาที
[Visual / Image Prompt]: (Describe visual strictly matching the LOCKED elements and 3D style)

  document.getElementById('result').value = prompt;
  document.getElementById('status').textContent = '✅ สร้าง Prompt สำเร็จ (อัปเดต ' + new Date().toLocaleTimeString('th-TH') + ')';
}

function initMasterUI() {
  const el = document.getElementById('masterStructure');
  if(el) el.value = masterStructure;
}

function saveMasterStructure() {
  const el = document.getElementById('masterStructure');
  const value = (el?.value || '').trim();
  if(!value) return alert('กรุณาใส่ STORY STRUCTURE กลาง ก่อนบันทึก');
  masterStructure = value;
  localStorage.setItem(MASTER_KEY, masterStructure);
  document.getElementById('masterStatus').textContent = '✅ บันทึก Master Structure แล้ว';
  buildPrompt();
}

function resetMasterStructure() {
  if(!confirm('คืนค่า STORY STRUCTURE กลาง เป็นค่าเริ่มต้นหรือไม่?')) return;
  masterStructure = DEFAULT_MASTER_STRUCTURE;
  localStorage.setItem(MASTER_KEY, masterStructure);
  document.getElementById('masterStructure').value = masterStructure;
  document.getElementById('masterStatus').textContent = '✅ คืนค่าเริ่มต้นแล้ว';
  buildPrompt();
}

function copyPromptText() {
  const text = document.getElementById('result').value;
  navigator.clipboard.writeText(text).then(() => alert('📋 Copy Prompt เตรียมนำไปวางใน ChatGPT แล้ว'));
}

function clearData() {
  if(!confirm('รีเซ็ตข้อมูลทั้งหมด?')) return;
  localStorage.removeItem(LS);
  localStorage.removeItem(PS);
  localStorage.removeItem(MASTER_KEY);
  location.reload();
}

renderPresets();
initMasterUI();
render();
</script>
</body>
