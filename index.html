<!DOCTYPE html>
<html lang="th">
<head>.
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Story Structure Builder PRO+</title>
<style>
:root{--bg:#071116;--card:#0d2026;--card2:#102a31;--line:#4fd1c5;--text:#eaffff;--muted:#9bb7bc;--green:#20c997;--blue:#0d6efd;--purple:#7c4dff;--orange:#ff922b;--red:#dc3545}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 5%,rgba(79,209,197,.16),transparent 30%),radial-gradient(circle at 90% 5%,rgba(124,77,255,.12),transparent 30%),linear-gradient(180deg,#071116,#061015);color:var(--text)}
.container{display:flex;min-height:100vh}.left{width:68%;padding:12px;margin-right:32%;overflow:auto}.right{width:32%;position:fixed;right:0;top:0;height:100vh;padding:12px;background:#050909;border-left:1px solid #173238;display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;gap:6px;position:sticky;top:0;z-index:20;padding-bottom:10px;background:linear-gradient(180deg,#071116 80%,transparent)}button,select,input,textarea{font:inherit;border-radius:8px;border:1px solid #789196;padding:9px}button{cursor:pointer;font-weight:700}select,input,textarea{width:100%;background:#f5f7f7;color:#111}button{color:#fff;border:0}.btn-blue{background:var(--blue)}.btn-purple{background:var(--purple)}.btn-green{background:#20a15a}.btn-orange{background:var(--orange)}.active-mode{outline:3px solid #5fd3c6;box-shadow:0 0 16px rgba(95,211,198,.55)}
.card{background:linear-gradient(180deg,rgba(13,32,38,.97),rgba(8,24,29,.98));border:1px solid #21434a;border-left:5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 8px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.row{display:flex;gap:6px}.row>*{flex:1}.add{background:#159957}.edit{background:#0d6efd}.del{background:var(--red)}.copy{background:#59636a}.generate{background:linear-gradient(90deg,#20c997,#0d6efd);font-size:16px;padding:12px}.secondary{background:#26373c}.hidden{display:none!important}
.master-panel{background:linear-gradient(180deg,#101d23,#071114);border:1px solid #7c4dff;border-radius:12px;padding:10px;box-shadow:0 0 18px rgba(124,77,255,.12)}
.master-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.master-title{font-weight:800;font-size:14px}
.master-sub{font-size:10px;color:#9bb7bc;margin-top:3px;line-height:1.4}
.lock-badge{white-space:nowrap;font-size:10px;padding:4px 7px;border-radius:999px;background:#163c32;color:#8ff5ce;border:1px solid #20c997}
.master-editor{width:100%;min-height:180px;margin-top:8px;background:#020607;color:#bfffea;border:1px solid #2f625e;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.35;resize:vertical}
.master-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px}
.master-actions button{font-size:10px;padding:7px}
.master-status{font-size:10px;color:#82d8cf;margin-top:6px}
@media(max-width:900px){.master-actions{grid-template-columns:1fr}}

.output{flex:1;min-height:0;background:#020505;color:#8dff8d;border:1px solid #1e3b24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:none;line-height:1.45}.status{font-size:12px;color:#8fd3d0}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#17353b;color:#9ff7ed;font-size:11px;margin:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(760px,94vw);background:#0d2228;border:2px solid var(--line);border-radius:16px;padding:16px}.modal-actions{display:flex;gap:8px;margin-top:8px}.modal-actions>*{flex:1}
@media(max-width:900px){.left{width:100%;margin-right:0}.right{position:relative;width:100%;height:520px;border-left:0}.container{display:block}.topbar{overflow:auto}.topbar button{min-width:120px}}
</style>
</head>
<body>
<div class="container">
<section class="left">
<div class="topbar">
<button class="btn-blue" id="btnTopic" onclick="modeTopic()">📝 สร้างเรื่อง</button>
<button class="btn-purple" id="btnRef" onclick="modeReference()">🎧 Reference</button>
<button class="btn-orange" id="btnVdo" onclick="modeVdo()">🎬 VDO</button>
<button class="btn-green" onclick="window.location.href='https://gemini-prompt-pro.web.app/'">⌂ หน้าหลัก</button>
</div>

<div class="card" id="presetCard">
<h2>🧬 Story Style Preset</h2>
<select id="presetSelect" onchange="loadPreset()"></select>
<div class="row"><button class="add" onclick="openPresetModal()">➕ เพิ่ม</button><button class="edit" onclick="editPresetModal()">✏️ แก้ไข</button><button class="del" onclick="deletePreset()">🗑 ลบ</button></div>
<div id="presetTags"></div>
</div>

<div id="menu"></div>
</section>

<aside class="right">
<h2 style="margin:0">🧠 STORY STRUCTURE BUILDER</h2>

<div class="master-panel">
  <div class="master-head">
    <div>
      <div class="master-title">🧬 STORY STRUCTURE กลาง</div>
      <div class="master-sub">MASTER STRUCTURE • Generator ทุกตัวต้องอ่านก่อนสร้าง Prompt</div>
    </div>
    <span id="masterLock" class="lock-badge">🔒 MASTER LOCKED</span>
  </div>
  <textarea id="masterStructure" class="master-editor" spellcheck="false"></textarea>
  <div class="master-actions">
    <button class="btn-purple" onclick="saveMasterStructure()">💾 บันทึก Master</button>
    <button class="btn-orange" onclick="importCurrentStructure()">⬇️ ใช้ Structure ปัจจุบัน</button>
    <button class="secondary" onclick="resetMasterStructure()">↺ คืนค่า Master</button>
  </div>
  <div id="masterStatus" class="master-status">Master Structure พร้อมใช้งาน</div>
</div>

<div class="status" id="status">พร้อมสร้าง Prompt</div>
<textarea id="result" class="output" readonly></textarea>
<div class="row"><button class="copy" onclick="copyText()">📋 Copy Prompt</button><button class="generate" onclick="buildPrompt()">⚡ สร้าง Prompt</button></div>
<button class="secondary" onclick="clearData()">↻ รีเซ็ตข้อมูล</button>
</aside>
</div>

<div class="modal" id="presetModal"><div class="modal-box"><h2 id="presetTitle">Preset</h2><input id="presetName" placeholder="ชื่อ Preset"><textarea id="presetText" rows="12" placeholder="Story Style DNA"></textarea><div class="modal-actions"><button class="add" onclick="savePresetModal()">💾 บันทึก</button><button class="del" onclick="closePresetModal()">❌ ปิด</button></div></div></div>
<div class="modal" id="itemModal"><div class="modal-box"><h2 id="itemTitle">เพิ่มข้อมูล</h2><input id="itemName" placeholder="ชื่อที่แสดง"><textarea id="itemText" rows="10" placeholder="รายละเอียด"></textarea><div class="modal-actions"><button class="add" onclick="saveItemModal()">💾 บันทึก</button><button class="del" onclick="closeItemModal()">❌ ปิด</button></div></div></div>

<script>
const LS='STORY_STRUCTURE_BUILDER_DATA_V4_MASTER';
const PS='STORY_STRUCTURE_PRESETS_V4_MASTER';
let mode='topic', editKey=null, editIndex=-1;
const defaultPresets={
 raw:{name:'🔥 Raw เพื่อนเล่าให้เพื่อนฟัง',text:'RAW CONVERSATIONAL STORYTELLING. เล่าเหมือนกูนั่งเมาท์ให้มึงฟัง. ใช้ภาษาพูดจริง กู มึง แม่ง ว่ะ เออ คือ แบบ ตามธรรมชาติ. มีคำซ้ำและ pause เล็กน้อยได้. ห้ามยัดคำหยาบทุกประโยค. เน้นชีวิตจริง ความคิดในหัว ปฏิกิริยา และรายละเอียดเล็ก ๆ ที่ทำให้เรื่องดูจริง. ใช้ Open Loop และ Information Delay แบบไม่ฝืน. จังหวะสั้น-ยาวสลับกัน. เร่งเมื่อเรื่องพีค ผ่อนเมื่อสร้างอารมณ์. Ending ต้องเป็นธรรมชาติ ไม่สรุปเหมือนบทความ.'},
 comedy:{name:'😂 Comedy / กวน / พีค',text:'COMEDY STORY DNA. เปิดด้วยสถานการณ์หรือประโยคที่ชวนสงสัย. สร้าง Setup ให้คนเข้าใจผิดได้. ค่อย ๆ เพิ่มความ absurd หรือความซวย. ใช้ reaction เป็นตัวขยายมุก. เก็บ Punchline ไว้ให้ถึงจังหวะ. ห้ามยิงมุกทุกประโยค. ให้เรื่องเดินก่อน แล้วมุกเกิดจากเหตุการณ์.'},
 horror:{name:'👻 Horror / หลอน / Mystery',text:'HORROR STORY DNA. เริ่มจากเหตุการณ์ธรรมดา. ใส่รายละเอียดเล็ก ๆ ที่ผิดปกติ. ไม่รีบเฉลย. ใช้ silence, pause, negative space และ information delay. ค่อย ๆ เพิ่มความผิดปกติ. ให้ผู้ฟังสงสัยก่อนกลัว. Reveal ต้องมีเหตุผลจากสิ่งที่ปูไว้. Ending อาจทิ้งความรู้สึกค้าง.'},
 drama:{name:'💔 Drama / Emotional',text:'EMOTIONAL STORY DNA. เน้นความเป็นมนุษย์และความสัมพันธ์. ใช้รายละเอียดจริงและความคิดในใจ. ไม่บังคับร้องไห้หรือสรุปข้อคิด. สร้าง emotional change จากเหตุการณ์. จุดพีคคือความจริงหรือความรู้สึกที่ถูกเปิดเผย. จบด้วย realization หรือประโยคสั้น ๆ ที่มีน้ำหนัก.'},
 twist:{name:'🌀 Mystery / Twist',text:'TWIST STORY DNA. สร้างคำถามตั้งแต่ต้น. ให้ข้อมูลเพียงบางส่วน. ใช้รายละเอียดที่ดูธรรมดาเป็น clue. ทำให้ผู้ฟังเชื่อคำอธิบายหนึ่งก่อน. ค่อย reveal ข้อมูลที่เปลี่ยนความหมายของเรื่อง. Twist ต้องย้อนกลับไปอธิบายสิ่งที่เห็นก่อนหน้าได้. Payoff ต้องคุ้มกับ Open Loop.'},
 experience:{name:'🗣️ ประสบการณ์จริง / Confession',text:'PERSONAL EXPERIENCE DNA. เล่าแบบ FIRST PERSON. ใช้ความคิดและ reaction ของผู้เล่า. รักษาความไม่สมบูรณ์ของภาษาพูด. ให้เหตุการณ์เป็นตัวเดินเรื่อง. ไม่แต่งข้อเท็จจริงหากผู้ใช้ระบุว่าเรื่องจริง. เน้นรายละเอียดเฉพาะที่ทำให้ผู้ฟังรู้สึกว่าอยู่ตรงนั้นด้วย.'}
};
;
const DEFAULT_MASTER_STRUCTURE = `UNIVERSAL STORY STRUCTURE กลาง

01 ATTENTION / INTERRUPT
02 CONTEXT / HUMAN SETUP
03 TRIGGERING EVENT
04 REACTION
05 ESCALATION
06 OPEN LOOP / INFORMATION DELAY
07 REVELATION / TURNING POINT
08 TWIST OR EMOTIONAL CLIMAX
09 PAYOFF
10 REFLECTION / CALLBACK
11 NATURAL ENDING

ADAPTIVE RULE:
ไม่จำเป็นต้องใช้ทุก Stage หากไม่เหมาะกับเรื่อง แต่ห้ามทำลายลำดับ Narrative, Emotional Arc, Information Release และ Payoff`;

const MASTER_KEY = 'STORY_STRUCTURE_MASTER_V4';
let masterStructure = localStorage.getItem(MASTER_KEY) || DEFAULT_MASTER_STRUCTURE;

let presets=JSON.parse(localStorage.getItem(PS)||'null')||defaultPresets;
let data=JSON.parse(localStorage.getItem(LS)||'null')||{
 topic:{enabled:true,items:[{name:'หัวข้อเรื่อง',text:''}]},
 context:{enabled:true,items:[{name:'ข้อมูลเพิ่มเติม',text:''}]},
 facts:{enabled:true,items:[{name:'ข้อเท็จจริง / เหตุการณ์',text:''}]},
 type:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'COMEDY',text:'COMEDY'},{name:'DRAMA',text:'DRAMA'},{name:'HORROR',text:'HORROR'},{name:'MYSTERY',text:'MYSTERY'},{name:'TWIST',text:'TWIST'},{name:'LOVE',text:'LOVE'},{name:'LIFE STORY',text:'LIFE STORY'},{name:'EXPERIENCE',text:'EXPERIENCE'},{name:'CONFESSION',text:'CONFESSION'},{name:'INSPIRATION',text:'INSPIRATION'}]},
 angle:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'กูเจอมากับตัว',text:'PERSONAL EXPERIENCE'},{name:'เมาท์ให้เพื่อนฟัง',text:'FRIENDLY GOSSIP / CONVERSATIONAL'},{name:'ชวนสงสัย',text:'MYSTERY / CURIOSITY'},{name:'ฮาแบบธรรมชาติ',text:'COMEDIC'},{name:'ดราม่า',text:'EMOTIONAL'},{name:'หลอน',text:'SUSPENSE / HORROR'},{name:'หักมุม',text:'TWIST'}]},
 pov:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'กู / ฉัน — First Person',text:'FIRST PERSON'},{name:'มึง — Second Person',text:'SECOND PERSON'},{name:'ผู้เล่า — Third Person',text:'THIRD PERSON'}]},
 tone:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'RAW / ภาษาพูด',text:'RAW CONVERSATIONAL'},{name:'กวน',text:'PLAYFUL / SARCASTIC'},{name:'จริงจัง',text:'SERIOUS'},{name:'หลอน',text:'SUSPENSEFUL'},{name:'ดราม่า',text:'EMOTIONAL'},{name:'อบอุ่น',text:'WARM / REFLECTIVE'}]},
 emotion:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'อยากรู้',text:'CURIOSITY'},{name:'ขำ',text:'AMUSEMENT'},{name:'ลุ้น',text:'SUSPENSE'},{name:'ช็อก',text:'SHOCK'},{name:'สะเทือนใจ',text:'EMOTIONAL IMPACT'},{name:'อบอุ่น',text:'WARMTH'},{name:'คิดตาม',text:'REFLECTION'}]},
 duration:{enabled:true,items:[{name:'30 วินาที',text:'30 seconds'},{name:'45 วินาที',text:'45 seconds'},{name:'60 วินาที',text:'60 seconds'},{name:'90 วินาที',text:'90 seconds'},{name:'120 วินาที',text:'120 seconds'}]},
 scenes:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'1 Scene',text:'1'},{name:'2 Scenes',text:'2'},{name:'3 Scenes',text:'3'},{name:'4 Scenes',text:'4'},{name:'5 Scenes',text:'5'},{name:'6 Scenes',text:'6'},{name:'8 Scenes',text:'8'},{name:'10 Scenes',text:'10'}]},
 structure:{enabled:true,items:[{name:'STORY STRUCTURE กลาง (MASTER)',text:''}]},
 reference:{enabled:false,items:[{name:'ไม่มี Reference',text:'NO REFERENCE'}]},
 voice:{enabled:true,items:[{name:'AUTO',text:'AUTO'},{name:'กู / มึง / แม่ง / ว่ะ',text:'RAW THAI FRIEND-TO-FRIEND: กู มึง แม่ง ว่ะ เออ คือ แบบ'}]},
 vdo:{enabled:false,items:[{name:'9:16 TikTok',text:'Vertical 9:16'},{name:'Real Smartphone UGC',text:'Authentic handheld smartphone realism'}]}
};
function save(){localStorage.setItem(LS,JSON.stringify(data));localStorage.setItem(PS,JSON.stringify(presets))}
function get(key){if(!data[key]?.enabled)return '';let s=document.getElementById(key+'_s');return s?data[key].items[Number(s.value)]?.text||'':''}
function section(title,key){let c=data[key];if(!c?.enabled)return '';return `<div class="card"><h2>${title}</h2><select id="${key}_s" onchange="buildPrompt()">${c.items.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select><div class="row"><button class="add" onclick="openItem('${key}')">➕ เพิ่ม</button><button class="edit" onclick="editItem('${key}')">✏️ แก้ไข</button><button class="del" onclick="delItem('${key}')">🗑 ลบ</button></div></div>`}
function render(){document.getElementById('menu').innerHTML=section('📝 หัวข้อ / เรื่อง','topic')+section('📌 Context / ฉากหลัง','context')+section('🧾 Facts / เหตุการณ์ที่ต้องรักษา','facts')+section('🎭 Story Type','type')+section('🎯 Story Angle','angle')+section('👁 POV / มุมมอง','pov')+section('🎙 Tone / น้ำเสียง','tone')+section('❤️ Emotional Target','emotion')+section('⏱ ความยาว','duration')+section('🎬 จำนวน Scene','scenes')+section('🧬 STORY STRUCTURE กลาง • MASTER','structure')+section('🎧 Voice DNA','voice')+(mode==='ref'?section('🎧 Reference Style','reference'):'')+(mode==='vdo'?section('📐 VDO Format','vdo'):'');buildPrompt()}
function renderPresets(){let s=document.getElementById('presetSelect');s.innerHTML=Object.keys(presets).map(k=>`<option value="${k}">${esc(presets[k].name)}</option>`).join('');document.getElementById('presetTags').innerHTML='<span class="tag">Raw</span><span class="tag">Retention</span><span class="tag">Emotion</span><span class="tag">Payoff</span>';}
function loadPreset(){
  let p=presets[document.getElementById('presetSelect').value];
  if(p){
    data.structure.items[0]={name:'STORY DNA จาก Preset',text:p.text};
    save();
    buildPrompt();
  }
}
function openPresetModal(){editKey=null;document.getElementById('presetTitle').innerText='➕ เพิ่ม Story Preset';document.getElementById('presetName').value='';document.getElementById('presetText').value='';document.getElementById('presetModal').classList.add('show')}
function editPresetModal(){let k=document.getElementById('presetSelect').value,p=presets[k];if(!p)return;editKey=k;document.getElementById('presetTitle').innerText='✏️ แก้ไข Story Preset';document.getElementById('presetName').value=p.name;document.getElementById('presetText').value=p.text;document.getElementById('presetModal').classList.add('show')}
function closePresetModal(){document.getElementById('presetModal').classList.remove('show')}
function savePresetModal(){let n=document.getElementById('presetName').value.trim(),t=document.getElementById('presetText').value.trim();if(!n||!t)return alert('กรอกชื่อและรายละเอียดก่อน');let k=(editKey||n).toLowerCase().replace(/[^a-z0-9ก-๙]+/gi,'_');presets[k]={name:n,text:t};save();renderPresets();document.getElementById('presetSelect').value=k;loadPreset();closePresetModal()}
function openItem(k){editKey=k;editIndex=-1;document.getElementById('itemTitle').innerText='➕ เพิ่มข้อมูล';document.getElementById('itemName').value='';document.getElementById('itemText').value='';document.getElementById('itemModal').classList.add('show')}
function editItem(k){let s=document.getElementById(k+'_s');if(!s)return;editKey=k;editIndex=Number(s.value);let x=data[k].items[editIndex];document.getElementById('itemTitle').innerText='✏️ แก้ไขข้อมูล';document.getElementById('itemName').value=x.name;document.getElementById('itemText').value=x.text;document.getElementById('itemModal').classList.add('show')}
function closeItemModal(){document.getElementById('itemModal').classList.remove('show')}
function saveItemModal(){let n=document.getElementById('itemName').value.trim(),t=document.getElementById('itemText').value.trim();if(!n&&!t)return alert('กรอกข้อมูลก่อน');let x={name:n||t,text:t||n};if(editIndex>=0)data[editKey].items[editIndex]=x;else data[editKey].items.push(x);save();render();closeItemModal()}
function delItem(k){let s=document.getElementById(k+'_s');if(!s)return;let i=Number(s.value);if(data[k].items.length<=1)return alert('ต้องเหลืออย่างน้อย 1 รายการ');if(confirm('ลบรายการนี้?')){data[k].items.splice(i,1);save();render()}}
function deletePreset(){let s=document.getElementById('presetSelect'),k=s.value;if(Object.keys(presets).length<=1)return alert('ต้องเหลืออย่างน้อย 1 Preset');if(confirm('ลบ Preset นี้?')){delete presets[k];save();renderPresets();loadPreset()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function modeTopic(){mode='topic';data.reference.enabled=false;data.vdo.enabled=false;setActive('btnTopic');render()}
function modeReference(){mode='ref';data.reference.enabled=true;data.vdo.enabled=false;setActive('btnRef');render()}
function modeVdo(){mode='vdo';data.reference.enabled=false;data.vdo.enabled=true;setActive('btnVdo');render()}
function setActive(id){['btnTopic','btnRef','btnVdo'].forEach(x=>document.getElementById(x).classList.remove('active-mode'));document.getElementById(id).classList.add('active-mode')}
function buildPrompt(){
  let topic=get('topic'),context=get('context'),facts=get('facts'),type=get('type'),
      angle=get('angle'),pov=get('pov'),tone=get('tone'),emotion=get('emotion'),
      duration=get('duration'),scenes=get('scenes'),structure=masterStructure,
      voice=get('voice');
  let ref=mode==='ref'?get('reference'):'NO REFERENCE';
  let vdo=mode==='vdo'?get('vdo'):'NO VDO FORMAT LOCK';

  let prompt=`######
UNIVERSAL STORY STRUCTURE BUILDER — MASTER STRUCTURE EDITION

function initMasterUI(){
  const el=document.getElementById('masterStructure');
  if(el) el.value=masterStructure;

}

function syncMasterToData(){
  if(!data.structure) data.structure={enabled:true,items:[{name:'STORY STRUCTURE กลาง (MASTER)',text:''}]};
  data.structure.enabled=true;
  data.structure.items[0]={name:'STORY STRUCTURE กลาง (MASTER)',text:masterStructure};
  save();
}

function saveMasterStructure(){
  const el=document.getElementById('masterStructure');
  const value=(el?.value||'').trim();
  if(!value) return alert('กรุณาใส่ STORY STRUCTURE กลาง ก่อนบันทึก');
  masterStructure=value;
  localStorage.setItem(MASTER_KEY,masterStructure);
  syncMasterToData();
  document.getElementById('masterStatus').textContent='🔒 MASTER LOCKED • บันทึกแล้ว • Generator ทุกตัวต้องอ่าน Master นี้';
  buildPrompt();
}
